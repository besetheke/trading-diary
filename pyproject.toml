[project]
name = "trading-journal"
version = "0.1.0"
description = "Lokales Trading-Journal: Executions, Ketten, Kampagnen, Analytik"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    # AP-13: Der OptionApp-Trade-Export ist eine echte XLSX-Datei
    # (Arbeitsblatt `Trades`), kein CSV — ohne Leser nicht einlesbar.
    "openpyxl>=3.1",
    # AP-07l: Lese-API über die Daten, die `journal rebuild` schreibt.
    "fastapi>=0.115",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    # Der Testclient von Starlette setzt httpx voraus (AP-07lv).
    "httpx>=0.27",
]

[project.scripts]
journal = "journal.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["journal", "ingest", "engine", "analytics", "api"]

[tool.ruff]
line-length = 100
# Hook- und Settings-Dateien sind Werkzeugkonfiguration, kein Projektcode.
extend-exclude = [".claude"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.isort]
# Die Projektpakete fest als eigene deklarieren. Sonst ordnet ruff ein noch
# nicht existierendes Modul als fremd ein und verlangt nach dessen Anlage eine
# andere Importreihenfolge — eine Abnahmebasis, die vor der Umsetzung
# geschrieben wird, müsste dann nachträglich angefasst werden, was Regel 1
# verbietet (so geschehen bei AP-04vk).
known-first-party = ["engine", "ingest", "journal", "analytics", "api", "werkzeuge"]

[tool.ruff.lint.per-file-ignores]
# Alembic-Autogenerate erzeugt bewusst lange Zeilen, Docstring-Leerzeichen
# und eine eigene Importordnung; der Inhalt ist maschinell erzeugt und wird
# nachträglich nicht von Hand editiert (CLAUDE.md, Regel 3).
"migrations/versions/*" = ["E501", "W291", "I001"]
# Abgleichsskripte gegen die Golden-Daten: Auswertungscode mit langen
# Ausgabezeilen, kein Produktcode (werkzeuge/abgleich/README.md).
"werkzeuge/abgleich/*" = ["E501"]
